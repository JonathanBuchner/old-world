<section
  class="app-modal change-log-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="change-log-modal-title"
  tabindex="-1"
  data-modal-window="change-log"
>
  <button
    class="app-modal__close"
    type="button"
    aria-label="Close Change Log modal"
    data-modal-close
  >
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>

  <h2 id="change-log-modal-title" class="app-modal__title text-desk-h2">Change Log</h2>

  <div class="app-modal__body text-desk-regular">
    <p>Change log content will go here.</p>
  </div>
</section>
