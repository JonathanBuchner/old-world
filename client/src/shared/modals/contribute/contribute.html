<section
  class="app-modal contribute-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="contribute-modal-title"
  tabindex="-1"
  data-modal-window="contribute"
>
  <button
    class="app-modal__close"
    type="button"
    aria-label="Close Contribute modal"
    data-modal-close
  >
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>

  <h2 id="contribute-modal-title" class="app-modal__title text-desk-h2">Contribute</h2>

  <div class="app-modal__body text-desk-regular">
    <p>Contribute content will go here.</p>
  </div>
</section>
