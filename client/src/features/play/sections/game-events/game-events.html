<section
  class="game-events app-transparent-panel"
  aria-label="Game events"
  data-game-events-section
>
  <button
    class="game-events__close"
    type="button"
    aria-label="Close events panel"
    data-game-events-close
  >
    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
  </button>

  <div class="game-events__list" aria-label="Event log">
    <button class="event-button game-events__event game-events__event--left" type="button">
      Opening move declared
    </button>
    <button class="event-button game-events__event game-events__event--right" type="button">
      Reaction window
    </button>
    <button class="event-button game-events__event game-events__event--left" type="button">
      Unit advanced
    </button>
    <button class="event-button game-events__event game-events__event--right" type="button">
      Defense roll
    </button>
    <button class="event-button game-events__event game-events__event--left" type="button">
      Objective scored
    </button>
  </div>
</section>
