<section
  class="game-actions app-transparent-panel"
  aria-label="Game actions"
  data-game-actions-section
>
  <button class="action-button" type="button" aria-label="Undo">
    <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
    <span>Undo</span>
  </button>

  <button class="action-button" type="button" aria-label="Redo">
    <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
    <span>Redo</span>
  </button>

  <button
    class="action-button"
    type="button"
    aria-label="Toggle events panel"
    aria-expanded="false"
    data-game-events-toggle
  >
    <i class="fa-solid fa-ticket-simple" aria-hidden="true"></i>
    <span>Events</span>
  </button>
</section>
